<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
  <caption>Weekly Class Schedule</caption>
  <thead>
    <tr>
      <th scope="col">Day</th>
      <th scope="col">Time Slot</th>
      <th scope="col">Subject</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="rowgroup" rowspan="3">Monday</th>
      <td>10:00 AM - 11:30 AM</td>
      <td>HTML</td>
    </tr>
    <tr>
      <td>11:30 AM - 01:00 PM</td>
      <td>CSS</td>
    </tr>
    <tr>
      <td>01:00 PM - 02:30 PM</td>
      <td>JavaScript</td>
    </tr>
  </tbody>
</table>
</body>
</html>
